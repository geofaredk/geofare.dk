# Server block for the static site. Loaded as /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Never build redirects from the internal port (8080); the proxy sees the public one.
    absolute_redirect off;

    # Compression. gzip_proxied any: requests that come through the reverse proxy
    # carry a Via header, and nginx would otherwise skip compression for them.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript text/javascript
               application/json application/xml image/svg+xml application/manifest+json;

    # A missing page gets the custom page and a real 404 status.
    error_page 404 /404.html;

    # Health check for Docker. Not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok";
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output (CSS, JS, fonts): the file name changes when the content does.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed static files: favicon, share image, robots.txt, sitemap. One day.
    location ~* \.(?:svg|png|ico|webmanifest|txt|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Pages. "/privacy" is served from privacy/index.html without a redirect.
    # no-cache means the browser revalidates every time, so new content shows at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
