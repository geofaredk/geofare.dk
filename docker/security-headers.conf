# Security headers, included by every location in nginx.conf.
# nginx drops add_header lines inherited from the server block as soon as a location
# defines one of its own (for example Cache-Control), so each location includes this file.
# "always" adds them to error responses too (404 and so on).
#
# The CSP matches how the site is built: external scripts, styles and fonts only, all from the
# site itself, plus the Cabin analytics script and the address it reports to (see analytics in
# src/config/site.ts).
# The JSON-LD block is data, not script, so it needs no exception.
# No HSTS here: the container serves plain HTTP and the reverse proxy owns TLS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://scripts.withcabin.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ping.withcabin.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
