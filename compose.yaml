# A fixed project name, so this stack never shares a name with another project
# that lives in a folder called "website".
name: geofare

services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://geofare.example}
    # Overridable so the smoke test can build under its own tag.
    image: ${GEOFARE_IMAGE:-geofare-website}
    ports:
      - "${GEOFARE_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
